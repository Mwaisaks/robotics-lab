name: CI

on:
  pull_request:
  push:
    branches: ['main']

jobs:
  check:
    name: typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci
        env:
          npm_config_onnxruntime_node_install_cuda: skip

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck API
        # Serverless functions have their own tsconfig (api/tsconfig.json).
        run: if [ -f api/tsconfig.json ]; then npx tsc --noEmit -p api; else echo "no api/ yet"; fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
